name: CI/CD Pipeline

on:
  push:
    branches:
      - dev
      - feature/**
  pull_request:
    branches:
      - dev

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore DS3.sln

      - name: Build
        run: dotnet build DS3.sln --configuration Release --no-restore

      - name: Run Tests
        run: dotnet test DS3.sln --verbosity normal

      - name: Run Code Analysis
        run: dotnet format --check

      - name: Simulate Deployment
        run: |
          mkdir deploy
          Copy-Item -Path Matematicas\bin\Release\net8.0\* -Destination deploy -Recurse -Force
